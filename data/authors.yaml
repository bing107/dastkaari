# Author profiles — the core E-E-A-T (Experience, Expertise, Authoritativeness,
# Trust) asset for this site. Google treats immigration / visa / tax advice as
# YMYL ("Your Money or Your Life") content and holds it to its highest trust bar.
# The `dastkaari` key matches the default `author: "Dastkaari"` on every article
# (Hugo urlize of "Dastkaari" -> "dastkaari"), so this file drives every byline
# and bio box at once. To raise the trust signal further, add a real full name
# and LinkedIn URL to the fields below.

dastkaari:
  name: "Hassan & the Dastkaari Team"
  title: "Founder & Editorial Team, Dastkaari"
  bio: >-
    Dastkaari is written and edited by Hassan and a small team of Pakistani
    professionals living in Berlin. We moved from Pakistan to Germany more than
    a decade ago and went through the whole journey ourselves — assembling the
    visa file, the Anmeldung, the queues at the Ausländerbehörde, opening a bank
    account, choosing health insurance, and the job hunt. We write these guides
    so other Pakistanis do not have to reconstruct the process from scattered
    forum posts and WhatsApp forwards the way we did.
  credentials: >-
    10+ years living and working in Germany; first-hand experience with the EU
    Blue Card, Anmeldung, statutory health insurance, the Ausländerbehörde, and
    building careers in Berlin as Pakistani expats.
  location: "Berlin, Germany"
  # Optional strengthener: add a real full name + LinkedIn URL here to raise the
  # E-E-A-T / trust signal further if AdSense asks for more accountability.
  linkedin: ""
  email: "hello@dastkaari.com"
