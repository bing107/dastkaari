# Author profiles — the core E-E-A-T (Experience, Expertise, Authoritativeness,
# Trust) asset for this site. Google treats immigration / visa / tax advice as
# YMYL ("Your Money or Your Life") content and holds it to its highest trust bar.
# Anonymous authorship is a large part of why AdSense rejected the site.
#
# FOUNDER ACTION — do a single find-and-replace for each token below:
#   [[FOUNDER_NAME]]         -> your real full name (e.g. "Umair Hassan")
#   [[FOUNDER_BIO]]          -> optional: your own opening sentence; or delete the
#                               token and keep the default lived-experience bio.
#   [[FOUNDER_CREDENTIALS]]  -> one line, e.g. "10+ years living and working in
#                               Germany; went through the Blue Card and
#                               Niederlassungserlaubnis process personally."
#   [[FOUNDER_LINKEDIN]]     -> your full LinkedIn profile URL (https://...).
#                               The site only prints the LinkedIn link and the
#                               schema.org sameAs once the value starts with http,
#                               so the placeholder stays hidden until you fill it.
#
# The key `dastkaari` matches the default `author: "Dastkaari"` used across every
# article (Hugo urlize of "Dastkaari" -> "dastkaari"), so NO article edits are
# needed — filling the tokens here updates every byline and bio box at once.

dastkaari:
  name: "[[FOUNDER_NAME]]"
  title: "Founder & Editor, Dastkaari"
  # 2-3 sentences of lived expertise. Keep [[FOUNDER_BIO]] to add your own opener,
  # or delete just that token — the default text below already establishes it.
  bio: >-
    [[FOUNDER_BIO]] I moved from Pakistan to Germany more than a decade ago and
    went through the whole journey myself — assembling the visa file, the
    Anmeldung, the queues at the Ausländerbehörde, opening a bank account, and
    the job hunt. I live in Berlin today and write these guides so other
    Pakistanis do not have to reconstruct the process from scattered forum posts
    and WhatsApp forwards the way I did.
  credentials: "[[FOUNDER_CREDENTIALS]]"
  location: "Berlin, Germany"
  linkedin: "[[FOUNDER_LINKEDIN]]"
  email: "hello@dastkaari.com"
